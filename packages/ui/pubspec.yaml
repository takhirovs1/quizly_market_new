name: ui
description: "UI Kit"
version: 1.0.0+1

environment:
  sdk: ^3.9.2

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  intl: any
  meta: any
  collection: any
  web: any

  cupertino_icons: ^1.0.8

  # vector graphics
  flutter_svg: ^2.2.3
  vector_graphics: ^1.1.19
  lottie: ^3.0.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # code generation
  build_runner: ^2.10.4
  flutter_gen_runner: ^5.12.0
  vector_graphics_compiler: ^1.1.19

flutter:
  uses-material-design: true

  assets:
    - lib/images/
    - lib/vectors/
    - lib/lottie/
    - lib/audio/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Black.otf
          weight: 900
        - asset: lib/font/sf_pro_display/SF-Pro-Display-BlackItalic.otf
          weight: 900
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: lib/font/sf_pro_display/SF-Pro-Display-BoldItalic.otf
          weight: 700
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: lib/font/sf_pro_display/SF-Pro-Display-HeavyItalic.otf
          weight: 800
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Light.otf
          weight: 300
        - asset: lib/font/sf_pro_display/SF-Pro-Display-LightItalic.otf
          weight: 300
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: lib/font/sf_pro_display/SF-Pro-Display-MediumItalic.otf
          weight: 500
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: lib/font/sf_pro_display/SF-Pro-Display-RegularItalic.otf
          weight: 400
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: lib/font/sf_pro_display/SF-Pro-Display-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Thin.otf
          weight: 100
        - asset: lib/font/sf_pro_display/SF-Pro-Display-ThinItalic.otf
          weight: 100
          style: italic
        - asset: lib/font/sf_pro_display/SF-Pro-Display-Ultralight.otf
          weight: 200
        - asset: lib/font/sf_pro_display/SF-Pro-Display-UltralightItalic.otf
          weight: 200
          style: italic
    - family: Nunito
      fonts:
        - asset: lib/font/work_sans/Nunito-Black.ttf
          weight: 900
        - asset: lib/font/work_sans/Nunito-BlackItalic.ttf
          weight: 900
          style: italic
        - asset: lib/font/work_sans/Nunito-Bold.ttf
          weight: 700
        - asset: lib/font/work_sans/Nunito-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: lib/font/work_sans/Nunito-ExtraBold.ttf
          weight: 800
        - asset: lib/font/work_sans/Nunito-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: lib/font/work_sans/Nunito-ExtraLight.ttf
          weight: 200
        - asset: lib/font/work_sans/Nunito-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: lib/font/work_sans/Nunito-Italic.ttf
          style: italic
        - asset: lib/font/work_sans/Nunito-Light.ttf
          weight: 300
        - asset: lib/font/work_sans/Nunito-LightItalic.ttf
          weight: 300
          style: italic
        - asset: lib/font/work_sans/Nunito-Medium.ttf
          weight: 500
        - asset: lib/font/work_sans/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: lib/font/work_sans/Nunito-Regular.ttf
        - asset: lib/font/work_sans/Nunito-SemiBold.ttf
          weight: 600
        - asset: lib/font/work_sans/Nunito-SemiBoldItalic.ttf
          weight: 600
          style: italic

flutter_gen:
  output: lib/src/gen
  line_length: 120

  integrations:
    flutter_svg: true
