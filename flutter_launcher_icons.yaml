flutter_launcher_icons:
  image_path: "packages/ui/lib/images/logo.png"
  image_path_android: "packages/ui/lib/images/logo.png"
  image_path_ios: "packages/ui/lib/images/logo.png"
  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
  macos:
    generate: true
    image_path: "packages/ui/lib/images/logo.png"
  adaptive_icon_background: "packages/ui/lib/images/logo.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "packages/ui/lib/images/logo.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "packages/ui/lib/images/logo.png" # only available for Android 13 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  background_color_ios: "#1CB0F6"
